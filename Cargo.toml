[package]
name = "tinvo"
version = "0.19.0"
edition = "2024"
rust-version = "1.85"
authors = ["A.C.B"]
description = "Keyboard-driven terminal digital audio workstation with zero dependencies"
readme = "README.md"
license = "MIT"
repository = "https://github.com/IACBI/tinvo"
keywords = ["daw", "audio", "synthesizer", "sequencer", "terminal"]
categories = ["multimedia::audio", "command-line-utilities"]
publish = false

# TINVO deliberately has no third-party dependencies. Everything is built on
# the Rust standard library plus direct FFI to native operating-system APIs.
[dependencies]

[[test]]
name = "realtime"
# Its own allocator counts calls on one thread; the harness adds threads.
harness = false

[profile.dev]
# Tests render seconds of audio; unoptimised DSP makes them needlessly slow.
opt-level = 1

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
