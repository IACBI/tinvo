name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable
      - name: Install ALSA headers and start a JACK server
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y libasound2-dev jackd2
          nohup setsid jackd --no-realtime -d dummy -r 48000 -p 256 > "$RUNNER_TEMP/jackd.log" 2>&1 &
          sleep 3
          cat "$RUNNER_TEMP/jackd.log"
          echo TINVO_REQUIRE_JACK=1 >> "$GITHUB_ENV"
      - name: Install a loopback audio device
        if: runner.os == 'macOS'
        run: |
          brew install --cask blackhole-2ch
          sudo killall -9 coreaudiod
          sleep 5
          echo TINVO_REQUIRE_AUDIO=1 >> "$GITHUB_ENV"
          echo TINVO_REQUIRE_LOOPBACK=1 >> "$GITHUB_ENV"
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test (debug, overflow checks on)
        run: cargo test
      - name: Test (release)
        run: cargo test --release
      - name: Smoke test the CLI
        shell: bash
        run: |
          cargo run --release -- demo demo.tvo
          cargo run --release -- render demo.tvo demo.wav --loops 1
          cargo run --release -- bench --check
          cargo run --release -- devices
          cargo run --release -- inputs
          cargo run --release -- midi
      - name: Probe JACK, then PipeWire's JACK
        if: runner.os == 'Linux'
        run: |
          cargo run --release -- probe --device jack 1
          pkill jackd
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y pipewire pipewire-bin pipewire-jack
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/xdg"
          mkdir -p "$XDG_RUNTIME_DIR" && chmod 700 "$XDG_RUNTIME_DIR"
          nohup setsid pipewire > "$RUNNER_TEMP/pipewire.log" 2>&1 &
          sleep 3
          pw-jack cargo test --release jack
          pw-jack cargo run --release -- probe --device jack 1
      - name: Probe low latency
        if: runner.os == 'macOS'
        run: |
          cargo run --release -- probe 1
          cargo run --release -- probe --low-latency 1
          cargo run --release -- probe --device BlackHole --low-latency 1

  fuzz:
    name: Fuzz the parsers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - run: cargo build --release
      # The run's id as the seed: each run explores new inputs, and the log
      # names the seed, so a failure can be repeated.
      - name: Fuzz projects, WAV files and edit scripts (60 s each)
        run: |
          for target in project wav edits; do
            ./target/release/tinvo fuzz "$target" --seconds 60 --seed "${{ github.run_id }}"
          done
      - name: Keep a failing input
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-failure
          path: fuzz-*.input

  instructions:
    name: Instruction budgets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev valgrind
      - run: cargo build --release
      # Counted by cachegrind, so the runner's load does not matter; see
      # bench/instructions.txt for how the budgets are kept.
      - run: ./target/release/tinvo bench --instructions bench/instructions.txt

  msrv:
    name: Minimum Rust version (1.85)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust 1.85
        run: |
          rustup toolchain install 1.85 --profile minimal
          rustup default 1.85
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - run: cargo check --all-targets
