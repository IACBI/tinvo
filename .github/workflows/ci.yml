name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable
      - name: Install ALSA headers and start a JACK server
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y libasound2-dev jackd2
          nohup setsid jackd --no-realtime -d dummy -r 48000 -p 256 > "$RUNNER_TEMP/jackd.log" 2>&1 &
          sleep 3
          cat "$RUNNER_TEMP/jackd.log"
          echo TINVO_REQUIRE_JACK=1 >> "$GITHUB_ENV"
      - name: Install a loopback audio device
        if: runner.os == 'macOS'
        run: |
          brew install --cask blackhole-2ch
          sudo killall -9 coreaudiod
          sleep 5
          echo TINVO_REQUIRE_AUDIO=1 >> "$GITHUB_ENV"
          echo TINVO_REQUIRE_LOOPBACK=1 >> "$GITHUB_ENV"
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test (debug, overflow checks on)
        run: cargo test
      - name: Test (release)
        run: cargo test --release
      - name: Smoke test the CLI
        shell: bash
        run: |
          cargo run --release -- demo demo.tvo
          cargo run --release -- render demo.tvo demo.wav --loops 1
          cargo run --release -- bench
          cargo run --release -- devices
          cargo run --release -- inputs
          cargo run --release -- midi

  msrv:
    name: Minimum Rust version (1.85)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust 1.85
        run: |
          rustup toolchain install 1.85 --profile minimal
          rustup default 1.85
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - run: cargo check --all-targets
